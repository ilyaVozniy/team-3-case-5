name: Notebook lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install Poetry
        run: pipx install poetry==1.8.3

      - name: Install lint dependencies
        run: poetry install --only dev --no-root

      - name: Lint notebooks
        run: make lint
