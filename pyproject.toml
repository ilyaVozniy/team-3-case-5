[tool.poetry]
name = "team-3-case-5"
version = "0.1.0"
description = "Food delivery ETA regression project"
authors = []
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
kagglehub = ">=0.3"
pandas = ">=2.0"
numpy = ">=1.26"
matplotlib = ">=3.7"
seaborn = ">=0.13"
catboost = ">=1.2"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.4,<0.5"
black = ">=24.0"
nbqa = ">=1.8"
jupyterlab = ">=4.0"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "B", "C4", "UP", "SIM", "I"]
ignore = [
    "E501",
    "E702",
    "E741",
    "B007",
    "B008",
    "B023",
    "B905",
    "C408",
    "F841",
    "SIM108",
    "UP008",
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["B018", "E402", "F821"]
